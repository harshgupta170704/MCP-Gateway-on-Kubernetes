{{- if not .Values.secrets.existingSecret }}
{{- $secretName := include "mcp-platform.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  mariadb-root-password: {{ index $existing.data "mariadb-root-password" }}
  mariadb-password: {{ index $existing.data "mariadb-password" }}
  wp-admin-password: {{ index $existing.data "wp-admin-password" }}
  wc-consumer-key: {{ index $existing.data "wc-consumer-key" }}
  wc-consumer-secret: {{ index $existing.data "wc-consumer-secret" }}
  woo-mcp-token: {{ index $existing.data "woo-mcp-token" }}
  sample-mcp-token: {{ index $existing.data "sample-mcp-token" }}
  postgres-password: {{ index $existing.data "postgres-password" }}
  gateway-session-secret: {{ index $existing.data "gateway-session-secret" }}
  gateway-encryption-key: {{ index $existing.data "gateway-encryption-key" }}
  gateway-admin-password: {{ index $existing.data "gateway-admin-password" }}
  gateway-member-password: {{ index $existing.data "gateway-member-password" }}
  llm-api-key: {{ index $existing.data "llm-api-key" | default ("" | b64enc) }}
  {{- else }}
  mariadb-root-password: {{ randAlphaNum 24 | b64enc | quote }}
  mariadb-password: {{ randAlphaNum 24 | b64enc | quote }}
  wp-admin-password: {{ "AdminPass!2026" | b64enc | quote }}
  wc-consumer-key: {{ printf "ck_%s" (randAlphaNum 40 | lower) | b64enc | quote }}
  wc-consumer-secret: {{ printf "cs_%s" (randAlphaNum 40 | lower) | b64enc | quote }}
  woo-mcp-token: {{ printf "wmcp_%s" (randAlphaNum 32) | b64enc | quote }}
  sample-mcp-token: {{ printf "smcp_%s" (randAlphaNum 32) | b64enc | quote }}
  postgres-password: {{ randAlphaNum 24 | b64enc | quote }}
  gateway-session-secret: {{ randAlphaNum 48 | b64enc | quote }}
  gateway-encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
  gateway-admin-password: {{ "AdminPass!2026" | b64enc | quote }}
  gateway-member-password: {{ "MemberPass!2026" | b64enc | quote }}
  llm-api-key: {{ "" | b64enc | quote }}
  {{- end }}
{{- end }}
