{{- if .Values.helloWorld.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world-html
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: hello-world
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location /healthz {
        default_type text/plain;
        return 200 "ok\n";
      }
      location / {
        default_type application/json;
        return 200 '{"status":"ok","service":"ingress-check","host":"$host","uri":"$request_uri"}\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: hello-world
  template:
    metadata:
      labels:
        {{- include "mcp-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: hello-world
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.helloWorld.image.repository }}:{{ .Values.helloWorld.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: hello-world-html
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: hello-world
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: hello-world
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: hello-world
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- if not .Values.wordpress.enabled }}
    - host: {{ .Values.ingress.storeHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 80
    {{- end }}
    {{- if and (not .Values.dashboard.enabled) (not .Values.gateway.enabled) }}
    - host: {{ .Values.ingress.appHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 80
    {{- end }}
{{- end }}
{{- end }}
