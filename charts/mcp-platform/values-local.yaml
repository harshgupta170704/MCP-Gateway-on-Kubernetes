global:
  storageClass: "local-path"
  imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "traefik"
  storeHost: "store.127.0.0.1.nip.io"
  appHost: "app.127.0.0.1.nip.io"
  tls:
    enabled: false

helloWorld:
  enabled: false

mariadb:
  enabled: true

wordpress:
  enabled: true

wooMcp:
  enabled: true

postgres:
  enabled: true

gateway:
  enabled: true

everythingMcp:
  enabled: true

sampleMcp:
  enabled: true

dashboard:
  enabled: true

networkPolicy:
  enabled: true
