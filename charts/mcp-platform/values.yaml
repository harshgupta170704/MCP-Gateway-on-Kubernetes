global:
  storageClass: "local-path"
  imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  storeHost: "store.127.0.0.1.nip.io"
  appHost: "app.127.0.0.1.nip.io"
  tls:
    enabled: false
    storeSecretName: "store-tls"
    appSecretName: "app-tls"

# Fallback responder used when store/gateway workloads are disabled (e.g. ingress smoke test)
helloWorld:
  enabled: true
  image:
    repository: nginx
    tag: "1.27-alpine"

mariadb:
  enabled: false
  image:
    repository: mariadb
    tag: "11.4"
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

wordpress:
  enabled: false
  image:
    repository: wordpress
    tag: "6.6-php8.2-apache"
  cliImage:
    repository: wordpress
    tag: "cli-2.11-php8.2"
  storage:
    size: 2Gi
  adminUser: "admin"
  adminEmail: "admin@example.com"
  storeTitle: "Urumi Store"
  currency: "USD"
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi

wooMcp:
  enabled: false
  image:
    repository: mcp-platform/woo-mcp
    tag: "local"
  replicas: 1
  timeoutMs: 10000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
  storage:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  enabled: false
  image:
    repository: mcp-platform/gateway
    tag: "local"
  replicas: 1
  adminEmail: "admin@urumi.local"
  adminName: "Admin"
  memberEmail: "member@urumi.local"
  memberName: "Member"
  upstreamTimeoutMs: 30000
  healthCheckIntervalMs: 20000
  allowedInternalSuffixes:
    - ".svc"
    - ".svc.cluster.local"
  llm:
    provider: "openai-compat"
    baseUrl: "https://generativelanguage.googleapis.com/v1beta/openai/"
    model: "gemini-2.5-flash"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

everythingMcp:
  enabled: false
  image:
    repository: mcp-platform/everything-mcp
    tag: "local"
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

sampleMcp:
  enabled: false
  image:
    repository: mcp-platform/sample-mcp
    tag: "local"
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

dashboard:
  enabled: false
  image:
    repository: mcp-platform/dashboard
    tag: "local"
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

networkPolicy:
  enabled: false

secrets:
  existingSecret: ""
